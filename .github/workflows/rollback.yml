name: Rollback Manual

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a la que revertir (ej: abc1234 o main)"
        required: true
        type: string
      environment:
        description: "Ambiente donde hacer rollback"
        required: true
        type: choice
        options: [staging, production]

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cambiar al commit o rama especificada
        run: git checkout ${{ inputs.version }}

      - name: Ejecutar rollback
        run: |
          echo "=============================="
          echo "  ROLLBACK"
          echo "  Ambiente:  ${{ inputs.environment }}"
          echo "  Versión:   ${{ inputs.version }}"
          echo "=============================="
          echo "Rollback completado exitosamente"
name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main]
    types: [completed]

jobs:
  deploy-staging:
    name: Deploy Staging
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Verificar configuración del ambiente
        run: |
          echo "========================================="
          echo "  DEPLOY A STAGING"
          echo "  Ambiente: ${{ vars.APP_ENV }}"
          echo "  Réplicas: ${{ vars.REPLICA_COUNT }}"
          echo "  DB configurada: ${{ secrets.DB_URL != '' && 'SI' || 'NO' }}"
          echo "  API Key configurada: ${{ secrets.API_KEY != '' && 'SI' || 'NO' }}"
          echo "========================================="

      - name: Ejecutar Rolling Update en Staging
        run: |
          chmod +x scripts/deploy.sh
          REPLICA_COUNT=${{ vars.REPLICA_COUNT }} ./scripts/deploy.sh ${{ github.sha }}

  deploy-production:
    name: Deploy Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Verificar configuración del ambiente
        run: |
          echo "========================================="
          echo "  DEPLOY A PRODUCCION"
          echo "  Ambiente: ${{ vars.APP_ENV }}"
          echo "  Réplicas: ${{ vars.REPLICA_COUNT }}"
          echo "  DB configurada: ${{ secrets.DB_URL != '' && 'SI' || 'NO' }}"
          echo "  API Key configurada: ${{ secrets.API_KEY != '' && 'SI' || 'NO' }}"
          echo "========================================="

      - name: Ejecutar Rolling Update en Produccion
        run: |
          chmod +x scripts/deploy.sh
          REPLICA_COUNT=${{ vars.REPLICA_COUNT }} ./scripts/deploy.sh ${{ github.sha }}
          
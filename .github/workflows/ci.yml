name: CI Pipeline

on:
  push:
    branches: [ main, feature/*, fix/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas unitarias
        run: pytest tests/ -v

      - name: Build imagen Docker
        run: docker build -t devops-app:${{ github.sha }} .

      - name: Reporte Trivy (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-app:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Subir resultados a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Compuerta Trivy (bloquea si hay CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-app:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Publicar imagen (solo en push a main)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag devops-app:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-22.04'

stages:
  - stage: CI
    displayName: 'Integración Continua'
    jobs:
      - job: LintAndTest
        displayName: 'Lint y Tests'
        steps:
          - script: pip3 install -r requirements.txt
            displayName: 'Instalar dependencias'

          - script: python3 -m flake8 . --max-line-length=100 --exclude=.git,__pycache__,.venv
            displayName: 'Linting con flake8'

          - script: python3 -m pytest tests/ -v
            displayName: 'Tests unitarios'
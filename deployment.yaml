apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
        - name: app
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: devops-app-config
            - secretRef:
                name: devops-app-secret
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: app-storage
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: app-data-pvc